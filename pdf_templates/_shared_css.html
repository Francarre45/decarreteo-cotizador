{# CSS compartido, idéntico al de las plantillas originales de DeCarreteo #}
<style>
  @page {
    size: A4;
    margin: 16mm 14mm 16mm 14mm;
    @bottom-left { content: "DeCarreteo.com · {{ pie_pagina }}"; font-size: 7.5pt; color: #a5aec2; font-family: 'Helvetica Neue', Arial, sans-serif; }
    @bottom-right { content: "Página " counter(page) " de " counter(pages); font-size: 7.5pt; color: #a5aec2; font-family: 'Helvetica Neue', Arial, sans-serif; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Helvetica Neue', Arial, sans-serif; color: #26324a; font-size: 10.5pt; background: #fff; }
  img { max-width: 100%; }

  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6mm; }
  .header img.logo { height: 15mm; }
  .header img.pin { height: 13mm; }

  .hero { background: linear-gradient(120deg, #2F5496 0%, #1c3766 100%); border-radius: 10px; padding: 7mm 10mm; color: #fff; margin-bottom: 6mm; }
  .hero .eyebrow { font-size: 8.5pt; letter-spacing: 2px; text-transform: uppercase; color: #FFC768; font-weight: 700; margin-bottom: 2mm; }
  .hero h1 { margin: 0; font-size: 20pt; font-weight: 800; }
  .hero .sub { margin-top: 2mm; font-size: 10pt; color: #dfe7f7; }

  .facts { display: flex; gap: 4mm; margin-bottom: 6mm; }
  .fact-card { flex: 1; background: #f5f7fb; border: 1px solid #e4e9f2; border-left: 4px solid #F5A623; border-radius: 6px; padding: 4mm 5mm; }
  .fact-card .k { font-size: 7.5pt; text-transform: uppercase; letter-spacing: 1px; color: #7c8aa5; font-weight: 700; margin-bottom: 1.5mm; }
  .fact-card .v { font-size: 11pt; font-weight: 700; color: #16305C; }

  .section { margin-bottom: 5mm; }
  .section-title { display: flex; align-items: center; gap: 3mm; margin-bottom: 3mm; }
  .section-title .bar { width: 5px; height: 5.5mm; background: #F5A623; border-radius: 3px; }
  .section-title h2 { margin: 0; font-size: 13pt; color: #16305C; font-weight: 800; }

  .services { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm 6mm; margin-bottom: 4mm; }
  .service-item { display: flex; align-items: flex-start; gap: 2.5mm; background: #fff; border: 1px solid #e9edf4; border-radius: 6px; padding: 3mm 3.5mm; }
  .service-item .chk { flex-shrink: 0; width: 5mm; height: 5mm; border-radius: 50%; background: #2F5496; color: #fff; font-size: 8pt; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .service-item .txt { font-size: 9.6pt; color: #33415c; line-height: 1.3; padding-top: 0.3mm; }

  .flight-card { border: 1px solid #e4e9f2; border-radius: 8px; margin-bottom: 3mm; overflow: hidden; page-break-inside: avoid; }
  .flight-card .tag { background: #16305C; color: #fff; font-size: 8pt; font-weight: 700; letter-spacing: 1px; padding: 2mm 4mm; display: inline-block; border-bottom-right-radius: 6px; }
  .flight-row { display: flex; align-items: center; padding: 3mm 5mm 1.5mm 5mm; gap: 3mm; }
  .flight-leg { flex: 1; }
  .flight-leg .date { font-size: 8pt; color: #8592ab; font-weight: 600; }
  .flight-leg .time-city { font-size: 13pt; font-weight: 800; color: #26324a; }
  .flight-leg .time-city .code { color: #E0472B; }
  .flight-leg .airport { font-size: 8pt; color: #7c8aa5; line-height: 1.25; margin-top: 0.5mm; }
  .flight-mid { flex: 0 0 22mm; text-align: center; color: #b7c0d1; font-size: 8pt; }
  .flight-mid .line { border-top: 1.5px dashed #b7c0d1; margin: 2mm 0 1mm 0; }
  .flight-airline { flex: 0 0 26mm; text-align: right; }
  .flight-airline img { height: 9mm; }
  .flight-meta { font-size: 8.3pt; color: #5a6478; padding: 0 5mm 2.5mm 5mm; }
  .flight-summary { background: #f5f7fb; font-size: 8.5pt; color: #4a5773; padding: 2mm 5mm; border-top: 1px solid #e9edf4; font-weight: 600; }
  .flight-wait { border-top: 1px solid #e9edf4; padding-top: 2.5mm; }
  .flight-wait .airport { text-align: center; color: #b7c0d1; }

  .hotels { display: grid; grid-template-columns: 1fr; gap: 5mm; margin-bottom: 4mm; }
  .hotel-card { border: 1px solid #e4e9f2; border-radius: 8px; padding: 4.5mm 5mm; background: #fbfcfe; }
  .hotel-card .place { font-size: 7.7pt; text-transform: uppercase; letter-spacing: 1px; color: #F5A623; font-weight: 800; margin-bottom: 1.5mm; }
  .hotel-card .name { font-size: 11pt; font-weight: 800; color: #16305C; margin-bottom: 1.5mm; }
  .hotel-card .nights { font-size: 9pt; color: #5a6478; }

  .hotel-list { display: flex; flex-direction: column; gap: 2mm; margin-bottom: 3mm; }
  .hotel-row { display: flex; align-items: center; border: 1px solid #e4e9f2; border-radius: 8px; padding: 2.8mm 5mm; background: #fff; gap: 4mm; page-break-inside: avoid; }
  .hotel-row .rank { flex-shrink: 0; width: 8mm; height: 8mm; border-radius: 50%; background: #16305C; color: #fff; font-size: 9pt; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .hotel-row .hotel-info { flex: 1; }
  .hotel-row .hotel-info .name { font-size: 10.5pt; font-weight: 800; color: #16305C; }
  .hotel-row .tagline { font-size: 8pt; color: #7c8aa5; flex-shrink: 0; text-align: right; max-width: 45mm; line-height: 1.3; }
  .hotel-row .price-block { flex-shrink: 0; text-align: right; min-width: 30mm; border-left: 1px dashed #e4e9f2; padding-left: 4mm; }
  .hotel-row .price-block .lbl { font-size: 6.6pt; text-transform: uppercase; letter-spacing: 0.5px; color: #8592ab; font-weight: 700; margin-bottom: 0.5mm; }
  .hotel-row .price-block .amt { font-size: 13.5pt; font-weight: 800; color: #16305C; }
  .hotel-row .price-block .amt .cur { font-size: 7.5pt; font-weight: 700; color: #7c8aa5; margin-right: 0.8mm; }
  .hotel-note { font-size: 8.7pt; color: #7c8aa5; font-style: italic; margin-bottom: 3mm; }

  .simple-hotel-list { display: flex; flex-direction: column; gap: 1.3mm; margin-bottom: 2mm; }
  .simple-hotel-row { display: flex; align-items: center; border: 1px solid #e4e9f2; border-radius: 8px; padding: 1.6mm 5mm; background: #fff; gap: 4mm; page-break-inside: avoid; }
  .simple-hotel-row .city { flex: 0 0 42mm; font-size: 7.5pt; text-transform: uppercase; letter-spacing: 0.6px; color: #F5A623; font-weight: 800; }
  .simple-hotel-row .hname { font-size: 9.8pt; color: #16305C; font-weight: 700; }

  .price-box, .fare-box { background: linear-gradient(120deg, #F5A623 0%, #ef8a1f 100%); border-radius: 10px; padding: 6mm 8mm; color: #fff; display: flex; justify-content: space-between; align-items: center; margin-bottom: 4mm; }
  .price-box .label, .fare-box .label { font-size: 9.5pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; max-width: 80mm; line-height: 1.35; }
  .price-box .amount, .fare-box .amount { font-size: 22pt; font-weight: 800; text-align: right; }
  .price-box .amount .cur, .fare-box .amount .cur { font-size: 10pt; font-weight: 700; vertical-align: top; margin-right: 1mm; }

  .note, .validity-note { background: #FFF6E8; border: 1px solid #F6D8A0; border-left: 4px solid #F5A623; border-radius: 6px; padding: 3.5mm 4.5mm; font-size: 9pt; color: #6b5327; line-height: 1.5; margin-bottom: 4mm; }
  .note b { color: #4d3c1a; }

  .payment { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4mm; margin-bottom: 4mm; }
  .pay-card { background: #f5f7fb; border: 1px solid #e4e9f2; border-radius: 6px; padding: 3.5mm 4mm; }
  .pay-card .k { font-size: 7.5pt; text-transform: uppercase; color: #7c8aa5; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 1.5mm; }
  .pay-card .v { font-size: 9.5pt; color: #26324a; font-weight: 700; line-height: 1.3; }

  .incnoinc { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; page-break-inside: avoid; margin-bottom: 4mm; }
  .incnoinc h3 { font-size: 10pt; color: #16305C; margin: 0 0 2mm 0; }
  .incnoinc .negative h3 { color: #a04040; }
  .incnoinc ul { margin: 0; padding-left: 4mm; }
  .incnoinc li { font-size: 9pt; color: #33415c; margin-bottom: 1.5mm; line-height: 1.35; }

  .day-card { border: 1px solid #e4e9f2; border-radius: 8px; margin-bottom: 2mm; overflow: hidden; page-break-inside: avoid; }
  .day-card .day-tag { background: #2F5496; color: #fff; font-size: 9pt; font-weight: 700; padding: 1.8mm 4.5mm; }
  .day-card .day-body { padding: 2mm 4.5mm; }
  .day-card .intro { font-size: 9.3pt; color: #4a5773; margin-bottom: 2mm; }
  .day-card ul { margin: 0; padding-left: 4.5mm; }
  .day-card li { font-size: 9.3pt; color: #33415c; margin-bottom: 1.3mm; line-height: 1.3; }
  .day-card .tip { margin-top: 2mm; font-size: 8.7pt; color: #a0731a; background: #FFF6E8; border-radius: 5px; padding: 1.8mm 3mm; font-weight: 600; }

  .cond-list { counter-reset: cond; padding: 0; margin: 0; list-style: none; }
  .cond-list li { counter-increment: cond; display: flex; gap: 3mm; margin-bottom: 2.2mm; font-size: 9.2pt; color: #3a465e; line-height: 1.4; }
  .cond-list li::before { content: counter(cond); flex-shrink: 0; width: 6mm; height: 6mm; border-radius: 50%; background: #16305C; color: #fff; font-size: 8.5pt; font-weight: 700; display: flex; align-items: center; justify-content: center; }

  .closing { text-align: center; background: #f5f7fb; border-radius: 8px; padding: 5mm 10mm; font-size: 9.5pt; color: #3a465e; line-height: 1.5; margin: 6mm 0; }
  .closing b { color: #16305C; }
  .signature { display: flex; align-items: center; gap: 5mm; border-top: 1px solid #e9edf4; padding-top: 5mm; }
  .signature .avatar { width: 15mm; height: 15mm; border-radius: 50%; background: #2F5496; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14pt; font-weight: 800; flex-shrink: 0; }
  .signature .info b { font-size: 11.5pt; color: #16305C; display: block; }
  .signature .info .role { font-size: 9pt; color: #7c8aa5; margin-bottom: 1.5mm; }
  .signature .info .contact { font-size: 9pt; color: #4a5773; line-height: 1.5; }
</style>
